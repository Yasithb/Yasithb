name: Contribution Snake

on:
  # Run daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Allow manual triggering
  workflow_dispatch:

  # Also run on pushes to main (useful after README changes)
  push:
    branches:
      - main

# Required for pushing to the output branch
permissions:
  contents: write

# Prevent overlapping runs on the same ref
concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub contribution snake (SVGs + optional GIF)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#00ff41&color_dots=#161b22,#0d1117,#21262d,#30363d,#484f58
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00ff41&color_dots=#161b22,#0d1117,#21262d,#30363d,#484f58
            dist/github-snake.gif?palette=github-dark&color_snake=#00ff41&color_dots=#161b22,#0d1117,#21262d,#30363d,#484f58
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: update contribution snake [skip ci]"